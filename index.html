<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variable.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="app-header">
        <h1>Kanban</h1>
        <div class="header-controls">
            <input type="text" id="search-input" class="search-input" placeholder="Search Cards...">
            <select id="priority-filter">
                <option value="">All priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <select id="label-filter">
                <option value="All labels"></option>
            </select>
        </div>
    </header>
    <div class="app-body">
        <aside id="sidebar" class="sidebar">
            <div id="board-list" class="board-list"></div>
            <button id="add-button-btn" class="add-board-btn">+ add board</button>
        </aside>
        <main id="board" class="board"></main>
    </div>
    <main id="board" class="board">

        <div class="column">
            <div class="column-header">
                <h2>To Do?</h2>
                <span class="card-count">3</span>
            </div>
            <div class="card-list">
                <div class="card">Fix login bug on mobile</div>
                <div class="card">Write unit test for auth mobile</div>
                <div class="card">Update favicon</div>
            </div>

            <button class="add-card-btn">+ add card</button>
        </div>

        <div class="column">
            <div class="column-header">
                <h2>In Progress</h2>
                <span class="card-count">2</span>
            </div>

            <div class="card-list">
                <div class="card">Redesign landing page hero</div>
                <div class="card">set up CI pipeline</div>
            </div>

            <button class="add-card-btn">+ add card</button>
        </div>
        <div class="column">
            <div class="column-header">
                <h2>Done</h2>
                <span class="card-count">1</span>
            </div>
            <div class="card-list">
                <div class="card">Initial project setup</div>
            </div>

            <button class="add-card-btn">+ add card</button>
        </div>

        <button class="add-column-btn">+ add column</button>
    </main>
    </div>

    <div id="card-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Add Card</h3>

            <form id="card-form">
                <label>
                    Title
                    <input type="text" id="card-title-input" required>
                </label>

                <div class="modal-labels" id="modal-labels"></div>
                <button type="button" id="add-label-btn" class="add-label-btn">+ label</button>

                <div class="modal-checklist" id="modal-checklist"></div>
                <div class="checklist-input-row">
                    <input type="text" id="checklist-item-input" placeholder="Add checklist item">
                    <button type="button" id="add-checklist-item-btn">+</button>
                </div>

                <div class="modal-actions">
                    <button type="button" id="modal-delete-btn" class="delete-btn hidden">Delete</button>
                    <button type="button" id="modal-cancel-btn">Cancel</button>
                    <button type="submit" id="modal-save-btn">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
