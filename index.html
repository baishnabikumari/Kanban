<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variable.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="app-header">
        <h1>Kanban</h1>
        <div class="header-controls">
            <input type="text" id="search-input" class="search-input" placeholder="Search Cards...">
            <select id="priority-filter">
                <option value="">All priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <select id="label-filter">
                <option value="">All labels</option>
            </select>
            <button type="button" id="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
            <button type="button" id="stats-toggle-btn">📊 Stats</button>
            <button type="button" id="undo-btn">Undo</button>
            <button type="button" id="redo-btn">Redo</button>
            <button type="button" id="export-btn">Export</button>
            <button type="button" id="import-btn">Import</button>
            <input type="file" id="import-input" accept="application/json" style="display:none">

        </div>
    </header>
    <div id="stats-panel" class="stats-panel hidden">
        <canvas id="stats-canvas" width="320" height="160"></canvas>
    </div>
    <div class="app-body">
        <aside id="sidebar" class="sidebar">
            <div id="board-list" class="board-list"></div>
            <button id="add-board-btn" class="add-board-btn">+ add board</button>
        </aside>
        <main id="board" class="board"></main>
    </div>
    <div id="card-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Add Card</h3>

            <form id="card-form">
                <label>
                    Title
                    <input type="text" id="card-title-input" required>
                </label>

                <div class="modal-labels" id="modal-labels"></div>
                <button type="button" id="add-label-btn" class="add-label-btn">+ label</button>

                <div class="modal-checklist" id="modal-checklist"></div>
                <div class="checklist-input-row">
                    <input type="text" id="checklist-item-input" placeholder="Add checklist item">
                    <button type="button" id="add-checklist-item-btn">+</button>
                </div>

                <div class="modal-actions">
                    <button type="button" id="modal-delete-btn" class="delete-btn hidden">Delete</button>
                    <button type="button" id="modal-cancel-btn">Cancel</button>
                    <button type="submit" id="modal-save-btn">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
